services:
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.10.1
        container_name: elasticsearch
        environment:
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
            - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
        volumes:
            - elasticsearch:/usr/share/elasticsearch/data
            - ./ELK/certs/elasticsearch-ssl-transport:/usr/share/elasticsearch/config/ssl-transport:ro
            - ./ELK/certs/elasticsearch-ssl-http/elasticsearch:/usr/share/elasticsearch/config/ssl-http:ro
            - ./ELK/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
        ports:
            - "9200:9200"
            - "9300:9300"
        restart: unless-stopped
        networks:
            my-network:
                aliases:
                    - elasticsearch
        ulimits:
            memlock:
                soft: -1
                hard: -1
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-k",
                    "-u",
                    "${ELASTIC_USERNAME}:${ELASTIC_PASSWORD}",
                    "--cacert",
                    "/usr/share/elasticsearch/config/certs/ca.crt",
                    "https://localhost:9200/_cluster/health?wait_for_status=yellow",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 60s

