input {
    beats {
        port => 5044
        ssl_enabled => true
        ssl_certificate => "/usr/share/logstash/config/ssl-transport/fullchain.server.crt"
        ssl_key => "/usr/share/logstash/config/ssl-transport/server.key"
    }
}

filter {
    if [level] == "ERROR" {
        mutate { add_field => { "severity" => "high" } }
    }
    if [level] == "WARN" {
        mutate { add_field => { "severity" => "medium" } }
    }
    if [level] == "INFO" {
        mutate { add_field => { "severity" => "low" } }
    }
    if [level] == "DEBUG" {
        mutate { add_field => { "severity" => "low" } }
    }
}

output {
    elasticsearch {
        hosts => ["${ELASTICSEARCH_HOSTS}"]
        index => "logstash-%{+YYYY.MM.dd}"
        user => "${LOGSTASH_USERNAME}"
        password => "${LOGSTASH_PASSWORD}"
        enable_metric => true
        ssl_enabled => true
        ssl_verification_mode => "full"
        ssl_certificate_authorities => "/usr/share/logstash/config/ssl-http/elasticsearch-ca.pem"
        manage_template => false
    }
    stdout { codec => rubydebug }
}
