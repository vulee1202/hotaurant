services:
    redis:
        image: redis:latest
        container_name: redis
        volumes:
            - redis:/data
            - ./cache/redis.conf:/etc/redis/redis.conf:ro
        ports:
            - "6379:6379"
        networks:
            - my-network
        command: ["redis-server", "/etc/redis/redis.conf"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3

    nginx:
        image: nginx:latest
        container_name: nginx
        user: root
        volumes:
            - nginx:/gui/build:/usr/share/nginx/html
            - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "9393:80"
        networks:
            - my-network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 10s
            timeout: 5s
            retries: 3

    app_service:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: app_service
        depends_on:
            - rabbitmq
            - redis
            - logstash
        volumes:
            - app_service:/app:/usr/src/app
        ports:
            - "3000:3000"
        networks:
            - my-network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/"]
            interval: 10s
            timeout: 5s
            retries: 3

networks:
    my-network:
        driver: bridge

volumes:
    app_service:
    redis:
    nginx:
