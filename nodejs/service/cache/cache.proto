import "google/protobuf/any.proto";

syntax = "proto3";

package cache;

service Cacher {
	rpc set (SetRequest) returns (SetResponse);
	rpc get (GetRequest) returns (GetResponse);
}

message SetRequest {
	string key = 1;
	google.protobuf.Any value = 2;
}

message SetResponse {
	string message = 1;
}

message GetRequest {
    string key = 1;
}

message GetResponse {
	google.protobuf.Any value = 2;
}
